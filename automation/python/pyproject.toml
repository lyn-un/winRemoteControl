[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrcdriver"
version = "0.1.0"
description = "Command-level automation SDK for winRemoteControl"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wrcdriver = "wrcdriver.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wrcdriver*"]
