name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure dependency-light targets
        run: cmake --preset core-tests
      - name: Build protocol and core tests
        run: cmake --build --preset core-tests
      - name: Run core tests
        run: ctest --preset core-tests

  terminal-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure terminal targets
        run: cmake --preset terminal-tests
      - name: Build terminal tests
        run: cmake --build --preset terminal-tests
      - name: Run terminal tests
        run: ctest --preset terminal-tests

  security-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Schannel security targets
        run: cmake --preset security-tests
      - name: Build Schannel security tests
        run: cmake --build --preset security-tests
      - name: Run Schannel security tests
        run: ctest --preset security-tests

  automation-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure automation driver targets
        run: cmake --preset automation-tests
      - name: Build automation driver targets
        run: cmake --build --preset automation-tests
      - name: Run C++ automation tests
        run: ctest --preset automation-tests
      - name: Run Python SDK tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = (Resolve-Path 'automation/python')
          python -m unittest discover -s automation/tests -p 'test_*.py' -v

  automation-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'lyn-un/winRemoteControl' &&
      vars.WRC_ENABLE_AUTOMATION_E2E == '1'
    runs-on: [self-hosted, Windows, X64, interactive]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build React presentation assets
        run: |
          npm.cmd ci --prefix frontend
          npm.cmd run build --prefix frontend
      - name: Configure normal Release application
        run: cmake --preset release
      - name: Build development Release application and automation driver
        run: cmake --build --preset release --target winRemoteControl wrcdriver
      - name: Run interactive two-process connection tests
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = (Resolve-Path 'automation/python')
          $env:WRC_RUN_E2E = '1'
          $env:WRC_EXECUTABLE = (Resolve-Path 'build/Release/winRemoteControl.exe')
          python -m unittest discover -s automation/tests -p 'test_*.py' -v
