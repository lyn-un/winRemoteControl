name: Core tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure dependency-light targets
        run: cmake --preset core-tests
      - name: Build protocol and core tests
        run: cmake --build --preset core-tests
      - name: Run core tests
        run: ctest --preset core-tests

  terminal-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure terminal targets
        run: cmake --preset terminal-tests
      - name: Build terminal tests
        run: cmake --build --preset terminal-tests
      - name: Run terminal tests
        run: ctest --preset terminal-tests

  security-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Schannel security targets
        run: cmake --preset security-tests
      - name: Build Schannel security tests
        run: cmake --build --preset security-tests
      - name: Run Schannel security tests
        run: ctest --preset security-tests
